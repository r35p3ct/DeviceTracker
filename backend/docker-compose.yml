services:
  devicetracker-backend:
    build: .
    network_mode: host
    environment:
      MQTT_BROKER: localhost
      MQTT_PORT: 1883
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: ttrss
      PG_PASSWORD: ttrss
      PG_DB: ttrss
      LISTEN_PORT: 8000
    restart: unless-stopped
