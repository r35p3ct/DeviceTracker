<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceTracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; }
        #map { width: 100%; height: 100vh; }
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e; z-index: 9999; display: flex;
            align-items: center; justify-content: center;
        }
        #login-box {
            background: #16213e; border-radius: 12px; padding: 32px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5); text-align: center;
            min-width: 300px;
        }
        #login-box h2 { color: #e2e8f0; margin-bottom: 20px; font-size: 20px; }
        #login-box input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155;
            background: #0f172a; color: #e2e8f0; font-size: 15px; outline: none;
        }
        #login-box input:focus { border-color: #3b82f6; }
        #login-box button {
            width: 100%; margin-top: 14px; padding: 12px; border: none;
            border-radius: 6px; background: #3b82f6; color: #fff; font-size: 15px;
            cursor: pointer; font-weight: 600;
        }
        #login-box button:hover { background: #2563eb; }
        #login-err { color: #f87171; margin-top: 10px; font-size: 13px; min-height: 20px; }

        #panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.92); border-radius: 8px;
            padding: 12px 16px; min-width: 230px; max-width: 300px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 13px;
        }
        #panel h3 { margin-bottom: 6px; font-size: 15px; }
        .device-row {
            padding: 6px 0; border-bottom: 1px solid #eee; cursor: pointer;
        }
        .device-row:hover { background: #f0f4ff; }
        .device-row:last-child { border-bottom: none; }
        .device-row .did { font-family: monospace; color: #2563eb; font-size: 12px; }
        .device-row .meta { color: #666; font-size: 11px; }
        .device-row .pos { color: #059669; font-size: 11px; margin-top: 2px; }
        .badge {
            display: inline-block; padding: 1px 6px; border-radius: 4px;
            font-size: 10px; margin-left: 6px; vertical-align: middle;
        }
        .badge-live { background: #dcfce7; color: #166534; }
        .badge-old { background: #fee2e2; color: #991b1b; }
        .badge-off { background: #fef3c7; color: #92400e; }

        #history-panel {
            position: absolute; bottom: 40px; left: 10px; z-index: 1000;
            background: rgba(255,255,255,0.93); border-radius: 8px;
            padding: 10px 14px; max-width: 320px; max-height: 45vh;
            overflow-y: auto; display: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 12px;
        }
        #history-panel h4 { margin-bottom: 6px; font-size: 13px; }
        #history-panel .hdr { color: #999; font-size: 11px; margin-bottom: 4px; }
        .hist-row {
            padding: 3px 4px; border-bottom: 1px solid #f5f5f5; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hist-row:hover { background: #e8f0fe; }
        .hist-row .t { color: #555; font-size: 11px; min-width: 50px; }
        .hist-row .c { color: #059669; font-size: 11px; font-family: monospace; }
        .hist-row .a { color: #999; font-size: 10px; margin-left: 6px; }
        .hist-row .check { margin-right: 6px; cursor: pointer; }
        #route-actions { margin-top: 6px; display: flex; gap: 6px; }
        #route-actions button {
            flex: 1; padding: 6px 0; border: none; border-radius: 6px;
            background: #3b82f6; color: #fff; font-size: 12px; cursor: pointer; font-weight: 600;
        }
        #route-actions button:disabled { background: #cbd5e1; cursor: default; }
        #route-actions .route-clear { background: #475569; }

        #status {
            position: absolute; bottom: 8px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.6); color: #fff; padding: 3px 10px;
            border-radius: 4px; font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div id="login-box">
            <h2>DeviceTracker</h2>
            <input type="password" id="login-pass" placeholder="password" autofocus />
            <button onclick="doLogin()">Enter</button>
            <div id="login-err"></div>
        </div>
    </div>

    <div id="map" style="display:none"></div>
    <div id="panel" style="display:none"><h3>Devices</h3><div id="device-list">—</div></div>
    <div id="history-panel" style="display:none">
        <h4 id="history-title">History</h4>
        <div id="history-list"></div>
        <div id="route-actions">
            <button id="route-btn" onclick="buildRoute()" disabled>Route (0)</button>
            <button class="route-clear" onclick="clearRoute()">Clear</button>
        </div>
        <div style="text-align:right;margin-top:4px">
            <span style="cursor:pointer;color:#999;font-size:10px" id="history-close">close</span>
        </div>
    </div>
    <div id="status" style="display:none">connecting...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map, markers = {}, deviceList = [], selectedDevice = null;
        var selectedKeys = {}, currentPoints = [], routeLine = null, routeMarkers = [], selectedPointMarker = null;

        async function doLogin() {
            var pass = document.getElementById('login-pass').value;
            var err = document.getElementById('login-err');
            try {
                var r = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                if (r.ok) {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('map').style.display = '';
                    document.getElementById('panel').style.display = '';
                    document.getElementById('status').style.display = '';
                    initMap();
                } else {
                    err.textContent = 'wrong password';
                }
            } catch (e) {
                err.textContent = 'network error';
            }
        }
        document.getElementById('login-pass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function initMap() {
            map = L.map('map', { attributionControl: false }).setView([55.75, 37.62], 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            refresh();
            setInterval(refresh, 5000);
        }

        async function refresh() {
            try {
                var resp = await fetch('/api/devices');
                deviceList = await resp.json();
                renderPanel();
                renderMarkers();
                if (selectedDevice) loadHistory(selectedDevice);
                document.getElementById('status').textContent =
                    'updated ' + new Date().toLocaleTimeString() + ' \u00b7 ' + deviceList.length + ' dev';
            } catch (e) {
                document.getElementById('status').textContent = 'error: ' + e.message;
            }
        }

        function renderPanel() {
            var el = document.getElementById('device-list');
            if (!deviceList.length) { el.innerHTML = '<div style="color:#999">no data</div>'; return; }
            el.innerHTML = deviceList.map(function(d) {
                var age = d.ts ? Math.round((Date.now()/1000 - d.ts) / 60) : 999;
                var lc = d.lat ? d.lat.toFixed(5) : '?';
                var ln = d.lon ? d.lon.toFixed(5) : '?';
                var badge = d.online === false
                    ? '<span class="badge badge-off">off</span>'
                    : (age < 2
                        ? '<span class="badge badge-live">live</span>'
                        : '<span class="badge badge-old">' + age + 'm</span>');
                var batt = d.battery_pct != null ? ' | batt ' + d.battery_pct + '%' : '';
                var prov = d.provider ? d.provider : '';
                return '<div class="device-row" onclick="selectDevice(\'' + d.device_id + '\')">'
                    + '<div class="did">' + d.device_id.slice(0, 8) + badge + '</div>'
                    + '<div class="pos">' + lc + ', ' + ln + '</div>'
                    + '<div class="meta">' + prov + batt + '</div>'
                    + '</div>';
            }).join('');
        }

        function renderMarkers() {
            var seen = {};
            deviceList.forEach(function(d) {
                if (!d.lat || !d.lon) return;
                seen[d.device_id] = true;
                if (markers[d.device_id]) {
                    markers[d.device_id].setLatLng([d.lat, d.lon]);
                    markers[d.device_id].setPopupContent(mkPopup(d));
                } else {
                    var m = L.marker([d.lat, d.lon]).addTo(map).bindPopup(mkPopup(d));
                    m.on('click', function() { selectDevice(d.device_id); });
                    markers[d.device_id] = m;
                }
            });
            Object.keys(markers).forEach(function(id) {
                if (!seen[id]) { map.removeLayer(markers[id]); delete markers[id]; }
            });
        }

        function mkPopup(d) {
            return '<b>' + d.device_id.slice(0, 12) + '</b><br>'
                + 'lat: ' + (d.lat ? d.lat.toFixed(6) : '?') + '<br>'
                + 'lon: ' + (d.lon ? d.lon.toFixed(6) : '?') + '<br>'
                + (d.accuracy != null ? 'acc: ' + d.accuracy + 'm<br>' : '')
                + (d.provider ? 'prov: ' + d.provider + '<br>' : '')
                + (d.battery_pct != null ? 'batt: ' + d.battery_pct + '%<br>' : '');
        }

        function clearRouteLayers() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            routeMarkers.forEach(function(m) { map.removeLayer(m); });
            routeMarkers = [];
        }

        async function selectDevice(id) {
            clearRouteLayers();
            if (selectedPointMarker) { map.removeLayer(selectedPointMarker); selectedPointMarker = null; }
            selectedKeys = {};
            currentPoints = [];
            updateRouteBtn();
            selectedDevice = id;
            document.getElementById('history-title').textContent = 'History: ' + id.slice(0, 12) + ' (loading...)';
            document.getElementById('history-panel').style.display = 'block';
            loadHistory(id);
        }

        async function loadHistory(id) {
            try {
                var resp = await fetch('/api/history/' + id + '?limit=1000');
                var data = await resp.json();
                if (data.error) throw new Error(data.error);
                var points = data.points || [];
                renderHistory(id, points, data.total);
            } catch (e) {
                document.getElementById('history-list').innerHTML = '<div style="color:red">error</div>';
            }
        }

        function renderHistory(id, points, total) {
            currentPoints = points;
            var el = document.getElementById('history-list');
            var totalTxt = (typeof total === 'number' && total !== points.length)
                ? points.length + ' / ' + total : points.length;
            document.getElementById('history-title').textContent =
                'History: ' + id.slice(0, 12) + ' (' + totalTxt + ')';
            updateRouteBtn();
            if (!points.length) { el.innerHTML = '<div style="color:#999">no points yet</div>'; return; }
            el.innerHTML = '<div class="hdr">click row \u2192 center map \u00b7 check 2+ \u2192 route (via extremes)</div>'
                + points.filter(function(p) { return p.lat && p.lon; }).map(function(p) {
                    var key = String(p.ts);
                    var t = p.time ? p.time.slice(11, 19) : '\u2014';
                    var checked = selectedKeys[key] ? 'checked' : '';
                    return '<div class="hist-row" onclick="centerPoint(' + p.lat + ',' + p.lon + ')">'
                        + '<input type="checkbox" class="check" data-key="' + key + '" ' + checked
                        + ' onclick="event.stopPropagation()" onchange="togglePoint(this)">'
                        + '<span class="t">' + t + '</span>'
                        + '<span class="c">' + p.lat.toFixed(5) + ', ' + p.lon.toFixed(5) + '</span>'
                        + '<span class="a">' + (p.accuracy || '?') + 'm</span>'
                        + '</div>';
                }).join('');
        }

        function centerPoint(lat, lon) {
            map.setView([lat, lon], 17);
            if (selectedPointMarker) map.removeLayer(selectedPointMarker);
            selectedPointMarker = L.circleMarker([lat, lon], {
                radius: 5, color: '#dc2626', fillColor: '#dc2626', fillOpacity: 0.8, weight: 2
            }).addTo(map).bindPopup(lat.toFixed(6) + ', ' + lon.toFixed(6)).openPopup();
        }

        function togglePoint(cb) {
            var key = cb.getAttribute('data-key');
            if (cb.checked) selectedKeys[key] = true;
            else delete selectedKeys[key];
            updateRouteBtn();
            autoRoute();
        }

        function updateRouteBtn() {
            var n = Object.keys(selectedKeys).length;
            var btn = document.getElementById('route-btn');
            btn.textContent = 'Route (' + n + ')';
            btn.disabled = n < 2;
        }

        function autoRoute() {
            if (Object.keys(selectedKeys).length >= 2) {
                buildRoute();
            } else {
                if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
                routeMarkers.forEach(function(m) { map.removeLayer(m); });
                routeMarkers = [];
            }
        }

        function buildRoute() {
            clearRouteLayers();
            var sel = currentPoints.filter(function(p) { return p.lat && p.lon && selectedKeys[String(p.ts)]; });
            if (sel.length < 2) return;
            var lo = Math.min.apply(null, sel.map(function(p) { return p.ts; }));
            var hi = Math.max.apply(null, sel.map(function(p) { return p.ts; }));
            var pts = currentPoints
                .filter(function(p) { return p.lat && p.lon && p.ts != null && p.ts >= lo && p.ts <= hi; })
                .sort(function(a, b) { return a.ts - b.ts; });
            var coords = pts.map(function(p) { return [p.lat, p.lon]; });
            if (coords.length < 2) return;
            routeLine = L.polyline(coords, {
                color: '#dc2626', weight: 3, opacity: 0.9, dashArray: '6,8'
            }).addTo(map);
            routeMarkers.push(L.circleMarker(coords[0], {
                radius: 6, color: '#16a34a', fillColor: '#16a34a', fillOpacity: 0.85, weight: 2
            }).addTo(map));
            routeMarkers.push(L.circleMarker(coords[coords.length - 1], {
                radius: 6, color: '#dc2626', fillColor: '#dc2626', fillOpacity: 0.85, weight: 2
            }).addTo(map));
            try { map.fitBounds(routeLine.getBounds().pad(0.1)); }
            catch (e) { map.setView(coords[0], 17); }
        }

        function clearRoute() {
            selectedKeys = {};
            clearRouteLayers();
            updateRouteBtn();
            if (selectedDevice) loadHistory(selectedDevice);
        }

        function closeHistory() {
            document.getElementById('history-panel').style.display = 'none';
            selectedDevice = null;
            selectedKeys = {};
            currentPoints = [];
            clearRouteLayers();
            if (selectedPointMarker) { map.removeLayer(selectedPointMarker); selectedPointMarker = null; }
        }
        document.getElementById('history-title').addEventListener('click', closeHistory);
        document.getElementById('history-close').addEventListener('click', closeHistory);
    </script>
</body>
</html>
